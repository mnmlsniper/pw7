# Это комментарий.
# Это название пайплайна
name: pw7 автотесты UI/API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# ручной запуск
  workflow_dispatch:

jobs:
  pw7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
      - name: Установить пакет
        run: npm ci
      - name: Установить браузеры
        run: npx playwright install --with-deps
      - name: Запусти тесты
        run: npm t
